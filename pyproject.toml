[project]
name = "nbody-setup"
version = "0.1.0"
description = "Prepare N-body simulations with ease!"
readme = "README.md"
authors = [{ name = "Sagan Sutherland", email = "sagan@farthinghalearms.com" }]
requires-python = ">=3.11"
dependencies = [
    "astropy>=8.0.1",
    "camb>=1.6.4",
    "numpy>=2",
    "pydoe>=1.5.0",
    "sim-engine",
    "tqdm>=4.68.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
sim-engine = { git = "https://github.com/smsutherland/sim-engine" }
